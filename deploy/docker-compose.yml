name: stock2

services:
  postgres:
    image: postgres:18
    container_name: stock2-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock2}
      POSTGRES_USER: ${POSTGRES_USER:-stock2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock2}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./stockdb:/var/lib/postgresql/data
    networks:
      - stock2-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock2} -d ${POSTGRES_DB:-stock2}"]
      interval: 10s
      timeout: 5s
      retries: 10

  stock2-api:
    image: ${STOCK2_API_IMAGE:-ghcr.io/leon-drq/stock2-api:release-test}
    container_name: stock2-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stock2}:${POSTGRES_PASSWORD:-stock2}@postgres:5432/${POSTGRES_DB:-stock2}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
      INTERNAL_CRON_TOKEN: ${INTERNAL_CRON_TOKEN:-change-me}
      NEXT_INTERNAL_BASE_URL: http://stock2-web:3000
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - stock2-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  stock2-scheduler:
    image: ${STOCK2_API_IMAGE:-ghcr.io/leon-drq/stock2-api:release-test}
    container_name: stock2-scheduler
    command: ["python", "-m", "app.scheduler_worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stock2}:${POSTGRES_PASSWORD:-stock2}@postgres:5432/${POSTGRES_DB:-stock2}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
      INTERNAL_CRON_TOKEN: ${INTERNAL_CRON_TOKEN:-change-me}
      NEXT_INTERNAL_BASE_URL: http://stock2-web:3000
    depends_on:
      stock2-api:
        condition: service_healthy
      stock2-web:
        condition: service_started
    networks:
      - stock2-net

  stock2-web:
    image: ${STOCK2_WEB_IMAGE:-ghcr.io/leon-drq/stock2-web:release-test}
    container_name: stock2-web
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-stock2}:${POSTGRES_PASSWORD:-stock2}@postgres:5432/${POSTGRES_DB:-stock2}
      QVERIS_API_KEY: ${QVERIS_API_KEY:-}
      MODEL_PROVIDER_KEY: ${MODEL_PROVIDER_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-}
      DEFAULT_MODEL_BASE_URL: ${DEFAULT_MODEL_BASE_URL:-}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-}
      CRON_SECRET: ${INTERNAL_CRON_TOKEN:-change-me}
      PYTHON_API_URL: http://stock2-api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
    depends_on:
      stock2-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - stock2-net

networks:
  stock2-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${STOCK2_NETWORK_SUBNET:-10.15.11.0/24}
