name: Docker Images

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Which service image to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - web
          - api
      push_images:
        description: "Push images to GHCR"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - release/test
    paths:
      - deploy/**
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - next.config.mjs
      - app/**
      - components/**
      - hooks/**
      - lib/**
      - public/**
      - styles/**
      - services/api/**
      - .github/workflows/docker-build.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-release-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: deploy/Dockerfile.web
          - service: api
            dockerfile: deploy/Dockerfile.api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check requested service and Dockerfile
        id: service
        shell: bash
        run: |
          requested="${{ inputs.services || 'all' }}"
          service="${{ matrix.service }}"
          dockerfile="${{ matrix.dockerfile }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$requested" != "all" && "$requested" != "$service" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=service not selected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f "$dockerfile" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=$dockerfile not found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')-$service"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "reason=ready" >> "$GITHUB_OUTPUT"

      - name: Report skipped image
        if: steps.service.outputs.enabled != 'true'
        run: echo "Skipping ${{ matrix.service }} image: ${{ steps.service.outputs.reason }}"

      - name: Set up Docker Buildx
        if: steps.service.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.service.outputs.enabled == 'true' && (github.event_name == 'push' || inputs.push_images == true || inputs.push_images == 'true')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: steps.service.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.service.outputs.image }}
          tags: |
            type=raw,value=release-test
            type=sha,prefix=release-test-
            type=raw,value=run-${{ github.run_number }}

      - name: Build and optionally push
        if: steps.service.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || inputs.push_images == true || inputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Write summary
        if: steps.service.outputs.enabled == 'true'
        run: |
          echo "### ${{ matrix.service }} image" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${{ steps.service.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Dockerfile: ${{ matrix.dockerfile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Push: ${{ github.event_name == 'push' || inputs.push_images == true || inputs.push_images == 'true' }}" >> "$GITHUB_STEP_SUMMARY"
