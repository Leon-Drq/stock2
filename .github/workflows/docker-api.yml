name: Docker API Image

on:
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push stock2-api image to GHCR"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - release/test
    paths:
      - .dockerignore
      - deploy/Dockerfile.api
      - services/api/**
      - .github/workflows/docker-api.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-api-release-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    name: Build stock2-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build options
        id: options
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "push_images=${{ github.event.inputs.push_images }}" >> "$GITHUB_OUTPUT"
          else
            echo "push_images=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')-api" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.options.outputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=release-test
            type=sha,prefix=release-test-
            type=raw,value=run-${{ github.run_number }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: ${{ steps.options.outputs.push_images == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=stock2-api
          cache-to: type=gha,mode=max,scope=stock2-api
