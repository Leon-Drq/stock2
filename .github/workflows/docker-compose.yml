name: Docker Compose

on:
  workflow_dispatch:
  push:
    branches:
      - release/test
    paths:
      - .dockerignore
      - deploy/**
      - package.json
      - pnpm-lock.yaml
      - next.config.mjs
      - app/**
      - components/**
      - hooks/**
      - lib/**
      - public/**
      - styles/**
      - services/api/**
      - .github/workflows/docker-compose.yml

permissions:
  contents: read

concurrency:
  group: docker-compose-release-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate and build compose services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config

      - name: Build compose services
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml build stock2-web stock2-api stock2-scheduler
